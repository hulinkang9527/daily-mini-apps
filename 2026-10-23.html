<style>
  :root{
    --desk:#23262e;
    --paper:#f3e9d2;
    --ink:#221c12;
    --ink-dim:#6b5f49;
    --red:#c0392b;
    --red-deep:#a33327;
    --term:#16181d;
    --green:#7ee787;
    --mono:"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--desk);
    background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 12px 48px;
  }
  .wrap{width:100%;max-width:620px}
  button{font-family:inherit;border:none;cursor:pointer;color:inherit}
  .hidden{display:none!important}

  /* ---------- 页面标题 ---------- */
  .head{text-align:center;margin-bottom:16px}
  .head h1{font-family:var(--mono);font-size:clamp(22px,6.4vw,30px);color:var(--paper);letter-spacing:3px;font-weight:900}
  .head h1 em{color:var(--red);font-style:normal}
  .head p{color:#8fa0bf;font-size:13px;margin-top:7px;letter-spacing:1px}

  /* ---------- 终端窗口 ---------- */
  .term-bar{
    display:flex;align-items:center;gap:7px;
    background:var(--term);color:#aeb6c6;
    border:1px solid #000;border-bottom:none;border-radius:10px 10px 0 0;
    padding:11px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.5px;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:#3a3f4d;flex:0 0 auto}
  .dot.live{background:var(--green);animation:blink 1.2s infinite;cursor:pointer}
  .dot.live.hot{background:var(--red);animation:shake .4s}
  @keyframes blink{50%{opacity:.25}}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .term-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .secret{
    margin-left:auto;flex:0 0 auto;background:var(--red);color:#fff;
    font-size:11px;font-weight:700;letter-spacing:2px;
    padding:3px 8px;border-radius:3px;transform:rotate(2deg);
  }
  .console{background:var(--term);border:1px solid #000;border-top:none;padding:14px}
  .hint{color:#7d879c;font-size:12.5px;margin-bottom:10px;letter-spacing:.5px}
  .hint b{color:var(--green);font-weight:700}
  #input{
    width:100%;min-height:66px;resize:vertical;
    background:#0c0e12;color:var(--green);
    border:1px solid #2c313c;border-radius:8px;
    padding:12px;font-size:15px;line-height:1.6;
    font-family:var(--mono);
  }
  #input::placeholder{color:#4c5563}
  #input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(126,231,135,.12)}
  .btn-row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .btn{
    min-height:48px;padding:12px 20px;border-radius:8px;
    font-size:16px;font-weight:700;letter-spacing:2px;
    transition:transform .08s,filter .15s;
  }
  .btn:active{transform:translateY(2px)}
  .btn-main{background:var(--red);color:#fff;flex:1;min-width:150px}
  .btn-main:hover{filter:brightness(1.12)}
  .btn-ghost{background:#2a2f3a;color:#cfd6e4}
  .btn-ghost:hover{filter:brightness(1.2)}

  /* ---------- 题库 tabs ---------- */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;min-height:44px;padding:10px 14px;border-radius:6px;
    background:#e9dfc4;border:1px solid #d3c39b;color:#5a4f38;
    font-size:14px;font-weight:700;position:relative;
  }
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tab .newdot{
    position:absolute;top:-7px;right:-8px;background:var(--red);color:#fff;
    font-size:10px;font-weight:700;padding:2px 5px;border-radius:8px;
    animation:pulse 1s infinite;
  }
  @keyframes pulse{50%{transform:scale(1.18)}}
  .lists{margin-top:6px}
  .list{display:none}
  .list.on{display:block}
  .li{
    display:block;width:100%;text-align:left;
    background:var(--paper);border:1px dashed #c9b78d;border-radius:6px;
    padding:12px;margin-bottom:8px;font-size:15px;color:var(--ink);
    min-height:44px;line-height:1.5;
  }
  .li:hover{background:#efe5cb}
  .li .no{color:var(--ink-dim);margin-right:8px;font-size:13px}
  .li .arr{float:right;color:var(--red);font-weight:900}

  /* ---------- 空状态 ---------- */
  .empty{
    margin-top:16px;border:2px dashed #3a4152;border-radius:6px;
    padding:36px 18px;text-align:center;color:#8fa0bf;
    font-family:var(--mono);font-size:15px;
  }
  .cursor{animation:blink 1s steps(1) infinite}

  /* ---------- 解密档案 ---------- */
  .doc{
    position:relative;
    background:var(--paper);
    background-image:repeating-linear-gradient(transparent 0 27px,rgba(180,160,110,.16) 27px 28px);
    border:1px solid #d8c9a3;
    border-radius:4px;
    box-shadow:0 16px 34px rgba(0,0,0,.45),inset 0 0 60px rgba(190,165,105,.16);
    margin-top:16px;padding:26px 22px 22px;color:var(--ink);
    overflow:hidden;
  }
  .doc::before,.doc::after{
    content:"";position:absolute;left:10px;width:12px;height:12px;border-radius:50%;
    background:var(--desk);box-shadow:inset 0 1px 2px rgba(0,0,0,.65);
  }
  .doc::before{top:16px}
  .doc::after{bottom:16px}
  .doc-head{
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    border-bottom:1px solid #d8c9a3;padding-bottom:9px;
    font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:.5px;
  }
  .doc-head .lvl{color:var(--red);font-weight:700}
  .row-orig{margin-top:16px;font-size:15.5px;line-height:1.7}
  .row-orig .tip{font-size:12px;color:var(--ink-dim);font-style:normal;margin-left:6px}
  .redact{
    background-image:linear-gradient(to bottom,var(--ink) 50%,transparent 50%);
    background-size:100% 200%;background-position:0 0;
    color:var(--ink);cursor:pointer;padding:0 3px;border-radius:2px;
    font-family:var(--mono);
    transition:background-position .45s ease,color .25s ease .12s;
  }
  .redact.open{background-position:0 -100%;color:var(--red-deep)}
  .cut{border:none;border-top:2px dashed #c9b78d;margin:18px 0 14px}
  .label{font-size:12px;color:var(--ink-dim);letter-spacing:3px;font-weight:700}
  .answer{
    font-family:var(--mono);font-size:17px;line-height:1.75;font-weight:700;
    margin-top:6px;min-height:3.6em;
  }
  .row-star{margin-top:16px;font-size:14px}
  .row-star .stars{color:var(--red);letter-spacing:4px;font-size:18px;font-family:var(--mono)}
  .row-roast{margin-top:8px;font-size:14.5px;color:#4d4231;line-height:1.7}
  .row-roast b{color:var(--red-deep)}
  .doc-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;position:relative;z-index:1}
  .stamp{
    position:absolute;right:16px;bottom:86px;
    width:62px;height:62px;border:3px double var(--red);border-radius:50%;
    color:var(--red);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:13px;line-height:1.15;text-align:center;
    letter-spacing:1px;
    transform:rotate(-12deg) scale(1.9);opacity:0;
    transition:transform .38s cubic-bezier(.2,1.7,.4,1),opacity .22s;
    mix-blend-mode:multiply;pointer-events:none;
  }
  .stamp.in{transform:rotate(-12deg) scale(1);opacity:.85}

  .foot{margin-top:16px;text-align:center;color:#5c6577;font-size:12px;font-family:var(--mono);letter-spacing:.5px}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-10px);
    background:#16181d;color:#e8edf7;border:1px solid #333a46;
    padding:10px 16px;border-radius:8px;font-size:14px;line-height:1.5;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    z-index:99;max-width:88vw;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:480px){
    body{padding:14px 10px 40px}
    .btn{width:100%;flex:none}
    .stamp{width:54px;height:54px;font-size:11.5px;bottom:92px;right:12px}
    .doc{padding:22px 16px 18px}
  }
  @media print{
    body{background:#fff;padding:0;display:block}
    .head,.term-bar,.console,.tabs,.lists,.empty,.doc-actions,.foot,.toast{display:none!important}
    .doc{box-shadow:none;border:1px solid #999;margin:0;background:#fff}
    .doc::before,.doc::after{display:none}
    .redact{background:none;color:var(--ink)}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <h1>老板黑话<em>解密</em>终端</h1>

    <div class="stamp" id="stamp">已<br>解<br>密</div>
  </section>

  <p class="foot" id="foot">2026-10-23 · 已解密 0 次 · 档案不上传，但会转发</p>
</div>
<div class="toast" id="toast" role="status"></div>

  for(var i=0;i<5;i++){s+=i<n?'★':'☆';}

    d.items.forEach(function(it,i){
      var b=document.createElement('button');
      b.type='button';b.className='li';
      var no=document.createElement('span');no.className='no mono';no.textContent=pad3(i+1);
      var q=document.createElement('span');q.textContent=it.q;
      var arr=document.createElement('span');arr.className='arr';arr.textContent='›';
      b.appendChild(no);b.appendChild(q);b.appendChild(arr);
      b.addEventListener('click',function(){
        $('#input').value=it.q;
        decrypt(it,d.label);
      });
      list.appendChild(b);
    });
    listsEl.appendChild(list);
  });
}
function buildTabs(){
  CATS.concat(hrUnlocked?['hr']:[]).forEach(function(cat){
    var d=DB[cat];
    var b=document.createElement('button');
    b.type='button';b.className='tab';b.dataset.cat=cat;b.textContent=d.label;
    if(cat==='hua'){b.classList.add('on');}
    b.addEventListener('click',function(){
      tabsEl.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
      b.classList.add('on');
      listsEl.querySelectorAll('.list').forEach(function(l){l.classList.remove('on');});
      var l=$('#list-'+cat);if(l){l.classList.add('on');}
    });
    tabsEl.appendChild(b);
  });
}

/* ================= 打字机 ================= */
function typeText(el,text,done){
  clearInterval(typeTimer);
  typeDone=done||null;
  typeDoneFired=false;
  var i=0;
  el.textContent='';
  typeTimer=setInterval(function(){
    i++;
    el.textContent=text.slice(0,i);
    if(i>=text.length){
      clearInterval(typeTimer);
      el.onclick=null;
      if(typeDone&&!typeDoneFired){typeDoneFired=true;typeDone();}
    }
  },26);
  el.onclick=function(){
    clearInterval(typeTimer);
    el.textContent=text;
    if(typeDone&&!typeDoneFired){typeDoneFired=true;typeDone();}
    el.onclick=null;
  };
}

/* ================= 解密主流程 ================= */
function decrypt(item,catLabel){
  decryptCount++;
  seq++;
  $('#foot').textContent=ISSUE_DATE+' · 已解密 '+decryptCount+' 次 · 档案不上传，但会转发';

  var no=$('#docNo');
  no.textContent='档案编号 NO.'+ISSUE_DATE.replace(/-/g,'')+'-'+pad3(seq%1000);
  $('#docLevel').textContent='密级：'+levelName(item.star);

  var qEl=$('#docQ');
  qEl.textContent=item.q;
  qEl.classList.remove('open');

  $('#docStar').textContent=stars(item.star);
  $('#docRoast').textContent=item.roast;

  var stamp=$('#stamp');
  stamp.classList.remove('in');

  $('#empty').classList.add('hidden');
  var doc=$('#doc');
  doc.hidden=false;

  typeText($('#docA'),item.a,function(){
    void stamp.offsetWidth;
    stamp.classList.add('in');
  });

  if(decryptCount===5&&!hrUnlocked){
    hrUnlocked=true;
    var tab=document.createElement('button');
    tab.type='button';tab.className='tab hidden';tab.id='tabHr';tab.dataset.cat='hr';
    tab.textContent=DB.hr.label;
    var nd=document.createElement('span');nd.className='newdot';nd.textContent='NEW';
    tab.appendChild(nd);
    tab.addEventListener('click',function(){
      tabsEl.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
      tab.classList.add('on');
      listsEl.querySelectorAll('.list').forEach(function(l){l.classList.remove('on');});
      var l=$('#list-hr');if(l){l.classList.add('on');}
    });
    tabsEl.appendChild(tab);
    var list=document.createElement('div');
    list.className='list';list.id='list-hr';
    DB.hr.items.forEach(function(it,i){
      var b=document.createElement('button');
      b.type='button';b.className='li';
      var no2=document.createElement('span');no2.className='no mono';no2.textContent=pad3(i+1);
      var q2=document.createElement('span');q2.textContent=it.q;
      var arr2=document.createElement('span');arr2.className='arr';arr2.textContent='›';
      b.appendChild(no2);b.appendChild(q2);b.appendChild(arr2);
      b.addEventListener('click',function(){$('#input').value=it.q;decrypt(it,DB.hr.label);});
      list.appendChild(b);
    });
    listsEl.appendChild(list);
    setTimeout(function(){tab.classList.remove('hidden');},80);
    toast('已解密 5 次：机密附件解锁 —— HR 黑话');
  }

  if(typeof doc.scrollIntoView==='function'){
    setTimeout(function(){doc.scrollIntoView({behavior:'smooth',block:'nearest'});},60);
  }
}

/* ================= 输入解密 ================= */
function findEgg(t){
  for(var i=0;i<EGGS.length;i++){
    if(t.indexOf(EGGS[i].k)>=0){return EGGS[i];}
  }
  return null;
}
function findExact(t){
  var all=CATS.concat('hr');
  for(var c=0;c<all.length;c++){
    var items=DB[all[c]].items;
    for(var i=0;i<items.length;i++){
      if(t.indexOf(items[i].q)>=0||(t.length>=2&&items[i].q.indexOf(t)>=0)){
        return {item:items[i],label:DB[all[c]].label};
      }
    }
  }
  return null;
}
function classify(t){
  for(var i=0;i<KW.length;i++){
    var ks=KW[i].k;
    for(var j=0;j<ks.length;j++){
      if(t.indexOf(ks[j])>=0){return KW[i].c;}
    }
  }
  return null;
}
function decodeInput(){
  var t=$('#input').value.trim();
  if(!t){toast('先输入一句老板原话，或者点上方题库');$('#input').focus();return;}
  var egg=findEgg(t);
  if(egg){decrypt(egg.item,'彩蛋档案');toast('彩蛋档案到手：'+egg.item.q);return;}
  var exact=findExact(t);
  if(exact){decrypt(exact.item,exact.label);return;}
  var cat=classify(t);
  if(cat&&(cat!=='hr'||hrUnlocked)){
    var it=pick(DB[cat].items);
    decrypt(it,DB[cat].label+' · 关键词命中');
    return;
  }
  if(cat==='hr'&&!hrUnlocked){
    var it2=pick(DB.hr.items);
    decrypt(it2,'HR黑话 · 提前泄露');
    return;
  }
  decrypt({
    q:t,
    a:'该言论未录入档案库，但中心思想已暴露：不想加钱，还想让你多干。',
    star:3,
    roast:'已自动归档至《待观察名单》。'
  },'未收录');
}

/* ================= 手气不错 ================= */
function lucky(){
  luckyCount++;
  if(luckyCount>=8&&luckyCount%8===0){
    toast('题库快被你摸穿了，留点给同事');
  }
  var pool=[];
  CATS.forEach(function(c){pool=pool.concat(DB[c].items);});
  if(hrUnlocked){pool=pool.concat(DB.hr.items);}
  if(Math.random()<0.22){
    var e=pick(EGGS);
    decrypt(e.item,'彩蛋档案');
    toast('手气爆棚，摸到彩蛋档案：'+e.item.q);
    return;
  }
  var it=pick(pool);
  decrypt(it,'随机档案');
}

/* ================= 复制转发语 ================= */
function shareText(){
  var q=$('#docQ').textContent;
  var a=$('#docA').textContent;
  var star=$('#docStar').textContent;
  var roast=$('#docRoast').textContent;
  var no=$('#docNo').textContent.replace('档案编号 ','');
  return '【老板黑话解密终端 · '+no+'】\n'+
    '原文：「'+q+'」\n'+

    '终端点评：'+roast+'\n'+
    '来解密你老板的原话 → '+SITE;
}
function copyText(t,cb){
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=t;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
    cb(ok);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){cb(true);},function(){fallback();});
  }else{
    fallback();
  }
}

/* ================= 事件绑定 ================= */
function bind(){
  $('#go').addEventListener('click',decodeInput);
  $('#lucky').addEventListener('click',lucky);
  $('#again').addEventListener('click',lucky);
  $('#copy').addEventListener('click',function(){
    copyText(shareText(),function(ok){
      toast(ok?'转发语已复制，快发到打工人群':'复制失败了，手动截个图也行');
    });
  });
  $('#docQ').addEventListener('click',function(){
    this.classList.toggle('open');
  });
  $('#input').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault();
      decodeInput();
    }
  });
  /* 终端小绿灯火柴：连戳 7 下，终端抖一抖 */
  var dotHits=0,dotTimer=null;
  $('#liveDot').addEventListener('click',function(){
    var dot=this;
    dotHits++;
    dot.classList.remove('hot');
    void dot.offsetWidth;
    dot.classList.add('hot');
    clearTimeout(dotTimer);
    dotTimer=setTimeout(function(){dotHits=0;dot.classList.remove('hot');},2500);
    if(dotHits>=7){
      dotHits=0;
      dot.classList.remove('hot');
      var bar=document.querySelector('.term-bar');
      bar.style.transition='transform .3s';
      bar.style.transform='translateX(4px)';
      setTimeout(function(){bar.style.transform='translateX(-4px)';},150);
      setTimeout(function(){bar.style.transform='';},320);
      toast('别戳了，HR 正在后台看日志');
    }
  });
}

/* ================= 启动 ================= */
buildTabs();
buildLists();
$('#list-hua').classList.add('on');
bind();
})();
