<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Mini Apps · 每日一个有趣小应用</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1420'/%3E%3Crect x='14' y='20' width='36' height='28' rx='4' fill='%23ffd166'/%3E%3Cpath d='M14 24 32 14l18 10v4H14z' fill='%23fff0c2'/%3E%3Crect x='29' y='18' width='6' height='30' fill='%230f1420' opacity='.35'/%3E%3C/svg%3E" />
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3650; --accent:#ffd166; --text:#e8edf7; --dim:#8fa0bf; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:3rem 1.2rem 4rem; }
  header { text-align:center; margin-bottom:2.5rem; }
  .logo { font-size:2.6rem; display:inline-block; animation:bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  h1 { font-size:1.7rem; margin:.6rem 0 .3rem; }
  .sub { color:var(--dim); font-size:.95rem; }
  .rules { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1rem 1.2rem; font-size:.9rem; color:var(--dim); margin-bottom:2rem; }
  .rules b { color:var(--accent); }
  .apps { display:grid; gap:.8rem; }
  .empty { text-align:center; padding:2.4rem 1rem; border:2px dashed var(--line); border-radius:12px; color:var(--dim); }
  .empty .big { font-size:2rem; display:block; margin-bottom:.6rem; }
  footer { margin-top:2.6rem; text-align:center; color:var(--dim); font-size:.8rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">🕹️</span>
    <h1>Daily Mini Apps</h1>
    <p class="sub">每天一个有趣小应用 · 自动生成 · 开箱即玩</p>
  </header>

  <div class="rules">
    🕘 每天 <b>09:00</b> 自动上新一个随机主题的小应用（小游戏 / 实用工具 / 创意玩物）
    <br/>📱 手机电脑都能玩，单文件 HTML 无依赖
  </div>

  <div class="apps" id="apps">
    <div class="empty">
      <span class="big">🌙</span>
      今天的小应用还在路上<br/><span style="font-size:.8rem">（本页会自动更新）</span>
    </div>
  </div>

  <footer>
    每天自动生成并发布到 GitHub · <a href="https://github.com/hulinkang9527/daily-mini-apps">仓库地址</a>
  </footer>
</div>
<script>
// 每日应用列表：由自动化流程每日更新
const APPS = [
  {date:'2026-10-23', name:'老板黑话解密终端 · 打工人内部资料', url:'2026-10-23.html'},
  {date:'2026-10-22', name:'烦恼粉碎机 · 一球砸碎今天', url:'2026-10-22.html'},
  {date:'2026-10-21', name:'涂鸦留声机 · 你画的东西会唱歌', url:'2026-10-21.html'},
  {date:'2026-10-20', name:'方块工位 · 把待办全消了', url:'2026-10-20.html'},
  {date:'2026-10-19', name:'人类使用说明书 · 给你身边的人出一本', url:'2026-10-19.html'},
  {date:'2026-10-18', name:'纸飞机邮筒 · 写给某个人', url:'2026-10-18.html'},
  {date:'2026-10-17', name:'弹窗大作战 · POP-UP WARS', url:'2026-10-17.html'},
  {date:'2026-10-16', name:'潜台词扫描仪', url:'2026-10-16.html'},
  {date:'2026-10-15', name:'摸鱼大作战 · 上班生存模拟器', url:'2026-10-15.html'},
  {date:'2026-10-14', name:'拆箱盲盒 · 今日份的快递', url:'2026-10-14.html'},
  {date:'2026-10-13', name:'今天吃点啥 · 大转盘', url:'2026-10-13.html'}
];
const box = document.getElementById('apps');
if (APPS.length) {
  box.innerHTML = APPS.map(a => '<a class="app" href="' + a.url + '" target="_blank" rel="noopener" style="display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;color:var(--text)"><b style="color:var(--accent)">' + a.date + '</b> · ' + a.name + '</a>').join('');
} else {
  box.innerHTML = '<div class="empty"><span class="big">🌙</span>今天的小应用还在路上<br/><span style="font-size:.8rem">（本页会自动更新）</span></div>';
}
</script>
</body>
</html>
